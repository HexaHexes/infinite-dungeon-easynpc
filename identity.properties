# Mod identity. Deliberately separate from gradle.properties: the version-bump
# doctrine treats gradle.properties as the CI-owned version slot and forbids
# bundling it with other changes, while a rename must ship identity alongside
# its code. build.gradle loads this file into the project extras before
# anything reads the identity, so gradle.properties stays byte-identical (the
# template's leftover identity keys there are inert, shadowed by these).
mod_id=infinite_dungeon_easynpc
mod_name=Infinite Dungeon EasyNPC
mod_group_id=org.bitwisemadness.infinitedungeoneasynpc
mod_authors=Bitwise Madness
mod_description=Optional EasyNPC content for Infinite Dungeon: the floor-1 receptionist, guild master and adventurer NPCs that populate the fixed lobby. Characters only - every transaction stays a Lightman's Currency trader (user ruling), so EasyNPC never sells or buys. The lobby degrades gracefully without this mod: empty rooms, no NPCs, Infinite Dungeon unaffected.