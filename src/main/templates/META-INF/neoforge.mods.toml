# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional, not required: the NPCs are authored content imported only when
# EasyNPC is present, and the lobby degrades gracefully without it. The code
# that touches EasyNPC classes is gated by ModList checks (see agents/REPO.md).
[[dependencies.${mod_id}]]
modId = "easynpc"
type = "optional"
versionRange = "[7.17.1,)"
ordering = "NONE"
side = "BOTH"

# Infinite Dungeon supplies the lobby this module populates. Optional too: the
# module is inert (no NPCs) when the lobby is absent, so it can be installed
# alongside any Infinite Dungeon build without crashing.
[[dependencies.${mod_id}]]
modId = "infinite_dungeon"
type = "optional"
versionRange = "[1.0.0-alpha.60,)"
ordering = "NONE"
side = "BOTH"

# Add your mod's dependencies below. Use type = "optional" for anything the mod
# works without, and gate the code that touches it (mixins, registrations) so it
# no-ops when the dependency is absent.
